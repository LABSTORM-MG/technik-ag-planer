name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: technik_ag_planer
          POSTGRES_USER: technik_ag_planer
          POSTGRES_PASSWORD: technik_ag_planer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U technik_ag_planer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://technik_ag_planer:technik_ag_planer@localhost:5432/technik_ag_planer
      DJANGO_READ_ENV_FILE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: Sicherheits-Check der Prod-Settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-nur-fuer-den-check-ci-nur-fuer-den-check-ci-nur-fuer-den-check
          DJANGO_ALLOWED_HOSTS: planer.example.org
        run: uv run python manage.py check --deploy --fail-level WARNING

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
