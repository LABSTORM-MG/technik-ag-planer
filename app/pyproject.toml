[project]
name = "technik-ag-planer"
version = "0.1.0"
description = "Planungs-App für Technik-AGs an Schulen"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django~=5.2.0",
  "django-environ>=0.12",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.5",
  "gunicorn>=23.0",
  "whitenoise>=6.9",
  "django-otp>=1.6",
  "qrcode>=8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.10",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
