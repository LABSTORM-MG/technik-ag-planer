<!doctype html>
<html lang="de">
<body style="font-family: system-ui, sans-serif; line-height: 1.5;">
  <p>Hallo {{ user }},</p>
  <p>für dein Konto im Technik-AG Planer wurde ein neues Passwort angefordert.</p>
  <p><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}">Neues Passwort setzen</a></p>
  <p>Der Link ist einen Tag gültig und funktioniert nur einmal.</p>
  <p>Du hast nichts angefordert? Dann ignoriere diese E-Mail – dein Passwort bleibt unverändert.</p>
</body>
</html>
