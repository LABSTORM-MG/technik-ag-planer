<label class="picker__item{% if widget.material.category_id %} color-{{ widget.material.category.color }}{% endif %}" data-picker-item data-category="{{ widget.material.category_id|default:'' }}" data-name="{{ widget.material.name|lower }}"><input type="radio" name="{{ widget.name }}" value="{{ widget.value|stringformat:'s' }}"{% include "django/forms/widgets/attrs.html" %}><span class="picker__text"><span class="picker__name">{{ widget.label }}</span><span class="picker__meta">{% if widget.material.category_id %}{{ widget.material.category.name }} · {% endif %}{% if widget.material.quantity is None %}Bestand beliebig{% else %}Bestand {{ widget.material.quantity }}{% endif %}</span></span></label>
