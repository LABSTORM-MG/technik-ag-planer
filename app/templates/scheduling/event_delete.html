{% extends "base.html" %}
{% block title %}Termin löschen{% endblock %}
{% block content %}
  <section class="card">
    <h1 class="page-title">„{{ event.title }}“ löschen?</h1>
    <p class="muted">{{ event.date|date:"l, j. F Y" }}</p>
    <form method="post" class="form">
      {% csrf_token %}
      {% if event.series %}
        <div class="field">
          <span class="field__label">Löschen für</span>
          <div class="segmented segmented--choice" role="radiogroup" aria-label="Löschen für">
            <label><input type="radio" name="scope" value="single" checked>Nur diesen Termin</label>
            <label><input type="radio" name="scope" value="following">Diesen und alle folgenden</label>
          </div>
        </div>
      {% endif %}
      <div class="form-actions">
        <a class="button button--secondary" href="{% url 'scheduling:event_detail' event.pk %}">Abbrechen</a>
        <button type="submit" class="button button--danger">Löschen</button>
      </div>
    </form>
  </section>
{% endblock %}
